<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBot v2.0 - Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<!-- Added h-full to body to ensure full viewport usage -->
<body class="bg-slate-950 text-slate-200 h-screen w-screen overflow-hidden">
    <!-- FIX: Added 'h-full' here so React container fills the screen -->
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged 
        } from 'firebase/auth';
        import { 
            getFirestore, 
            collection, 
            doc, 
            onSnapshot, 
            query, 
            addDoc,
            serverTimestamp,
            deleteDoc
        } from 'firebase/firestore';
        import { 
            MessageSquare, Brain, Database, Trash2, Sparkles, Activity, Cpu, 
            RefreshCw, Send, Image as ImageIcon, X, Palette, Mic, MicOff, 
            Volume2, Loader2 
        } from 'lucide-react';

        // ==========================================
        //  ✅ KEYS PRE-FILLED
        // ==========================================
        
        const apiKey = "AIzaSyCVYlHSAUuffVrg6Vz-hCf6pnGOO6kB41k"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyCvfc-flPMsVxc5jpieYGvLEdXQXP1xZDU",
            authDomain: "the--happy-path.firebaseapp.com",
            projectId: "the--happy-path",
            storageBucket: "the--happy-path.firebasestorage.app",
            messagingSenderId: "60661852828",
            appId: "1:60661852828:web:f5decb4022129532685b59"
        };

        // ==========================================

        const appId = 'default-app-id';
        const MASTER_USER_ID = "PRIMARY_USER";
        
        const TEXT_MODEL = "gemini-2.5-flash-preview-09-2025"; 
        const IMAGE_MODEL = "imagen-4.0-generate-001";
        const TTS_MODEL = "gemini-2.5-flash-preview-tts";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const convertToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        };

        const MemoryCard = ({ fact, onDelete }) => (
            <div className="group flex items-start justify-between p-3 mb-2 bg-slate-800/50 border border-slate-700 rounded-lg hover:border-indigo-500/50 transition-all">
                <div className="flex items-start gap-3">
                    <div className="mt-1"><Database className="w-4 h-4 text-indigo-400" /></div>
                    <p className="text-sm text-slate-300 leading-snug">{fact.content}</p>
                </div>
                <button onClick={() => onDelete(fact.id)} className="opacity-0 group-hover:opacity-100 p-1 hover:bg-red-500/20 rounded text-red-400 transition-all">
                    <Trash2 className="w-3.5 h-3.5" />
                </button>
            </div>
        );

        const ChatMessage = ({ message, onPlayAudio }) => {
            const isUser = message.role === 'user';
            const [isPlaying, setIsPlaying] = useState(false);
            const handlePlay = async () => {
                if (isPlaying) return;
                setIsPlaying(true);
                await onPlayAudio(message.content);
                setIsPlaying(false);
            };

            return (
                <div className={`flex w-full mb-6 ${isUser ? 'justify-end' : 'justify-start'}`}>
                    <div className={`flex max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'} gap-3`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${isUser ? 'bg-indigo-600' : 'bg-emerald-600'}`}>
                            {isUser ? <span className="text-xs font-bold">YOU</span> : <Cpu className="w-4 h-4" />}
                        </div>
                        <div className={`p-4 rounded-2xl shadow-sm flex flex-col gap-3 relative group ${isUser ? 'bg-indigo-600/20 text-indigo-100 rounded-tr-sm border border-indigo-500/30' : 'bg-slate-800 text-slate-200 rounded-tl-sm border border-slate-700'}`}>
                            {message.attachment && (
                                <div className="rounded-lg overflow-hidden border border-white/10 max-w-xs">
                                    <img src={message.attachment} alt="Upload" className="w-full h-auto object-cover" />
                                </div>
                            )}
                            {message.generatedImage && (
                                <div className="rounded-lg overflow-hidden border border-white/10 w-full">
                                    <img src={message.generatedImage} alt="AI Gen" className="w-full h-auto object-cover" />
                                    <div className="mt-2 text-xs text-slate-400 flex items-center gap-1"><Palette className="w-3 h-3" /> Generated by Imagen</div>
                                </div>
                            )}
                            {message.isThinking ? (
                                <div className="flex gap-2 items-center text-emerald-400 text-sm animate-pulse">
                                    <Activity className="w-4 h-4" /><span>Processing...</span>
                                </div>
                            ) : (
                                <p className="whitespace-pre-wrap text-sm leading-relaxed">{message.content}</p>
                            )}
                            {!isUser && !message.isThinking && message.content && (
                                <button onClick={handlePlay} disabled={isPlaying} className="absolute -bottom-6 left-0 p-1 text-slate-500 hover:text-emerald-400 transition-colors flex items-center gap-1">
                                    {isPlaying ? <Loader2 className="w-3 h-3 animate-spin" /> : <Volume2 className="w-3 h-3" />}
                                    <span className="text-[10px]">{isPlaying ? 'Speaking...' : 'Read'}</span>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        function MemoryBot() {
            const [user, setUser] = useState(null);
            const [input, setInput] = useState('');
            const [messages, setMessages] = useState([]);
            const [longTermFacts, setLongTermFacts] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [isLearning, setIsLearning] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [selectedImage, setSelectedImage] = useState(null);
            const [mode, setMode] = useState('chat');
            
            const fileInputRef = useRef(null);
            const messagesEndRef = useRef(null);
            const recognitionRef = useRef(null);

            useEffect(() => {
                const initAuth = async () => { await signInAnonymously(auth); };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const factsRef = collection(db, 'artifacts', appId, 'users', MASTER_USER_ID, 'memory_facts');
                const q = query(factsRef);
                return onSnapshot(q, (snapshot) => {
                    const facts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    facts.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLongTermFacts(facts);
                });
            }, [user]);

            useEffect(() => {
                if ('webkitSpeechRecognition' in window) {
                    const recognition = new window.webkitSpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.lang = 'en-US';
                    recognition.onresult = (event) => {
                        setInput(prev => prev + (prev ? ' ' : '') + event.results[0][0].transcript);
                        setIsRecording(false);
                    };
                    recognition.onerror = () => setIsRecording(false);
                    recognition.onend = () => setIsRecording(false);
                    recognitionRef.current = recognition;
                }
            }, []);

            useEffect(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), [messages, isProcessing, selectedImage]);

            const handleImageSelect = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) return alert("Image too large. Limit 5MB.");
                    setSelectedImage(await convertToBase64(file));
                }
            };

            const toggleRecording = () => {
                if (isRecording) recognitionRef.current?.stop();
                else { recognitionRef.current?.start(); setIsRecording(true); }
            };

            const playTTS = async (text) => {
                try {
                    const cleanText = text.replace(/[*#]/g, '');
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: cleanText }] }],
                            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Fenrir" } } } }
                        })
                    });
                    const data = await response.json();
                    const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                    if (inlineData) {
                        const binaryString = window.atob(inlineData.data);
                        const len = binaryString.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
                        const audio = new Audio(URL.createObjectURL(pcmToWav(new Int16Array(bytes.buffer))));
                        audio.play();
                    }
                } catch (err) { console.error("TTS Error:", err); }
            };

            const handleGenerateImage = async (prompt) => {
                const botId = Date.now();
                setMessages(prev => [...prev, { role: 'model', content: "Painting...", isThinking: true, id: botId }]);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: [{ prompt: prompt + ", vibrant colors, high resolution, photorealistic, 8k" }], parameters: { sampleCount: 1, aspectRatio: "1:1" } })
                    });
                    const data = await response.json();
                    
                    if (data.error) throw new Error(data.error.message);

                    const base64Image = data.predictions?.[0]?.bytesBase64Encoded;
                    if (base64Image) {
                        setMessages(prev => prev.map(m => m.id === botId ? { role: 'model', content: `Image: "${prompt}"`, generatedImage: `data:image/png;base64,${base64Image}` } : m));
                        extractFactsFromInteraction(`User requested image: ${prompt}`, "I generated an image.");
                    } else throw new Error("No image data returned");
                } catch (err) {
                    setMessages(prev => prev.map(m => m.id === botId ? { role: 'model', content: `Image Gen Error: ${err.message}` } : m));
                } finally { setIsProcessing(false); setMode('chat'); }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if ((!input.trim() && !selectedImage) || isProcessing) return;
                const userText = input;
                const userImg = selectedImage;
                setMessages(prev => [...prev, { role: 'user', content: userText, attachment: userImg }]);
                setInput(''); setSelectedImage(null); setIsProcessing(true);

                if (mode === 'generate') { await handleGenerateImage(userText); return; }

                try {
                    const memoryBlock = longTermFacts.map(f => `- ${f.content}`).join('\n');
                    const chatHistoryForAPI = messages.map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [
                            ...(m.content ? [{ text: m.content }] : []),
                            ...(m.attachment ? [{ inlineData: { mimeType: m.attachment.split(';')[0].split(':')[1], data: m.attachment.split(',')[1] } }] : [])
                        ]
                    }));
                    chatHistoryForAPI.push({
                        role: 'user',
                        parts: [
                            ...(userText ? [{ text: userText }] : []),
                            ...(userImg ? [{ inlineData: { mimeType: userImg.split(';')[0].split(':')[1], data: userImg.split(',')[1] } }] : [])
                        ]
                    });

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: chatHistoryForAPI,
                            systemInstruction: { parts: [{ text: `You are OmniBot v2.0. Capabilities: Vision, Speech, Memory. \n=== MEMORY ===\n${memoryBlock}\n==============` }] }
                        })
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        const errMsg = `API Error: ${data.error.message}`;
                        setMessages(prev => [...prev, { role: 'model', content: errMsg }]);
                        console.error("API Error:", data.error);
                        return;
                    }

                    const botResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "System error.";
                    setMessages(prev => [...prev, { role: 'model', content: botResponseText }]);
                    extractFactsFromInteraction(userImg ? `[Image] ${userText}` : userImg ? "[Image Attached]" : userText, botResponseText);
                } catch (error) {
                    setMessages(prev => [...prev, { role: 'model', content: `Connection error: ${error.message}` }]);
                } finally { setIsProcessing(false); }
            };

            const extractFactsFromInteraction = async (userText, botText) => {
                setIsLearning(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Extract NEW facts about User. User: "${userText}" AI: "${botText}" Existing: ${longTermFacts.map(f => f.content).join('; ')} Return "NO_FACTS" or fact sentences separated by "|"` }] }] })
                    });
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                    if (result && result !== "NO_FACTS") {
                        const newFacts = result.split('|').map(s => s.trim()).filter(s => s.length > 0 && s !== "NO_FACTS");
                        for (const fact of newFacts) {
                            if (!longTermFacts.some(existing => existing.content.toLowerCase() === fact.toLowerCase()) && user) {
                                await addDoc(collection(db, 'artifacts', appId, 'users', MASTER_USER_ID, 'memory_facts'), { content: fact, createdAt: serverTimestamp() });
                            }
                        }
                    }
                } catch (err) { console.error(err); } finally { setIsLearning(false); }
            };

            const deleteFact = async (id) => user && await deleteDoc(doc(db, 'artifacts', appId, 'users', MASTER_USER_ID, 'memory_facts', id));
            const clearMemory = async () => { if (confirm("Wipe memory?")) longTermFacts.forEach(f => deleteFact(f.id)); };
            const clearImage = () => { setSelectedImage(null); if (fileInputRef.current) fileInputRef.current.value = ''; };

            return (
                <div className="flex h-full">
                    <div className="flex-1 flex flex-col border-r border-slate-800 relative">
                        <div className="h-14 border-b border-slate-800 flex items-center px-6 bg-slate-900/50 justify-between">
                            <div className="flex items-center"><MessageSquare className="w-5 h-5 text-indigo-500 mr-2" /><h1 className="font-semibold text-slate-100">OmniBot v2.0</h1></div>
                            {isLearning && <div className="flex items-center gap-2 text-xs text-amber-400 bg-amber-400/10 px-2 py-1 rounded-full animate-pulse"><Sparkles className="w-3 h-3" /><span>Memorizing...</span></div>}
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 scrollbar-thin">
                            {messages.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-60">
                                    <Brain className="w-16 h-16 mb-4 text-slate-600" />
                                    <p>I can See, Hear, Speak, and Draw.</p>
                                    <div className="flex gap-4 mt-4 text-xs">
                                        <span className="flex items-center gap-1"><Mic className="w-3 h-3"/> Voice Input</span>
                                        <span className="flex items-center gap-1"><Volume2 className="w-3 h-3"/> Text-to-Speech</span>
                                        <span className="flex items-center gap-1"><Palette className="w-3 h-3"/> Image Gen</span>
                                    </div>
                                </div>
                            ) : messages.map((m, i) => <ChatMessage key={i} message={m} onPlayAudio={playTTS} />)}
                            <div ref={messagesEndRef} />
                        </div>
                        
                        {/* --- CHAT INPUT AREA --- */}
                        <div className={`p-4 bg-slate-900 border-t border-slate-800 transition-colors ${mode === 'generate' ? 'bg-purple-900/20' : 'bg-slate-900'}`}>
                            {selectedImage && (
                                <div className="mb-2 flex items-center gap-2 bg-slate-800 w-fit px-3 py-2 rounded-lg border border-slate-700">
                                    <img src={selectedImage} alt="Preview" className="w-8 h-8 rounded object-cover border border-slate-600" />
                                    <span className="text-xs text-slate-300">Image</span>
                                    <button onClick={clearImage} className="ml-2 hover:bg-slate-700 rounded-full p-1"><X className="w-3 h-3 text-slate-400" /></button>
                                </div>
                            )}
                            <form onSubmit={handleSendMessage} className="flex gap-2">
                                <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageSelect} />
                                <div className="flex gap-1">
                                    <button type="button" onClick={() => { setMode(prev => prev === 'generate' ? 'chat' : 'generate'); setSelectedImage(null); }} className={`w-10 h-10 rounded-lg flex items-center justify-center transition-all border ${mode === 'generate' ? 'bg-purple-600 border-purple-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-purple-400'}`}><Palette className="w-5 h-5" /></button>
                                    <button type="button" onClick={() => fileInputRef.current?.click()} className={`w-10 h-10 rounded-lg flex items-center justify-center transition-all bg-slate-800 border border-slate-700 text-slate-400 hover:text-indigo-400 ${mode === 'generate' ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={isProcessing || mode === 'generate'}><ImageIcon className="w-5 h-5" /></button>
                                    <button type="button" onClick={toggleRecording} className={`w-10 h-10 rounded-lg flex items-center justify-center transition-all border ${isRecording ? 'bg-red-500/20 border-red-500 text-red-500 animate-pulse' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-red-400'}`} disabled={isProcessing}>{isRecording ? <MicOff className="w-5 h-5" /> : <Mic className="w-5 h-5" />}</button>
                                </div>
                                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder={mode === 'generate' ? "Describe image..." : (isRecording ? "Listening..." : "Type a message...")} className={`flex-1 border text-white placeholder-slate-500 rounded-lg px-4 focus:outline-none focus:ring-2 transition-all ${mode === 'generate' ? 'bg-purple-900/10 border-purple-500/50 focus:ring-purple-500/50' : 'bg-slate-800 border-slate-700 focus:ring-indigo-500/50'}`} disabled={isProcessing} />
                                <button type="submit" disabled={isProcessing || (!input.trim() && !selectedImage)} className={`text-white rounded-lg px-6 transition-colors flex items-center justify-center disabled:opacity-50 ${mode === 'generate' ? 'bg-purple-600 hover:bg-purple-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}>{isProcessing ? <Loader2 className="w-5 h-5 animate-spin" /> : <Send className="w-5 h-5" />}</button>
                            </form>
                        </div>
                    </div>
                    
                    {/* --- RIGHT: Memory Panel --- */}
                    <div className="w-80 bg-slate-900/50 flex flex-col h-full border-l border-slate-800 shadow-xl">
                        <div className="h-14 border-b border-slate-800 flex items-center justify-between px-4 bg-slate-900/80">
                            <div className="flex items-center gap-2"><Brain className="w-4 h-4 text-emerald-400" /><h2 className="font-semibold text-sm tracking-wide text-slate-200">MEMORY</h2></div>
                            <div className="text-xs font-mono text-slate-500">{longTermFacts.length} FACTS</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 scrollbar-thin">
                            {longTermFacts.length === 0 ? (
                                <div className="text-center mt-10 p-4 border border-dashed border-slate-700 rounded-lg"><RefreshCw className="w-8 h-8 text-slate-600 mx-auto mb-2 opacity-50" /><p className="text-slate-500 text-sm">Memory Empty</p></div>
                            ) : longTermFacts.map(fact => <MemoryCard key={fact.id} fact={fact} onDelete={deleteFact} />)}
                        </div>
                        {longTermFacts.length > 0 && <div className="p-4 border-t border-slate-800 bg-slate-900/30"><button onClick={clearMemory} className="w-full flex items-center justify-center gap-2 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 py-2 rounded transition-colors"><Trash2 className="w-3 h-3" /> Clear Brain</button></div>}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<MemoryBot />);
    </script>
</body>
</html>
